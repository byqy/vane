# 集成测试专用配置（仅 src/test 生效，不影响运行时）

# Valkey Testcontainer 在测试类结束后先被销毁，Spring 上下文随后才关闭，
# 期间 Lettuce 持有连接池会尝试重连并打 "Cannot reconnect ... Connection closed prematurely"。
# 这是收尾噪音而非失败，测试环境压掉该分类日志；生产环境仍保留 WARN 以便发现真实断连。
logging.level.io.lettuce.core=OFF
logging.level.reactor.netty=ERROR

# 关闭 Lettuce 的优雅停机等待，避免关闭阶段阻塞测试退出
spring.data.redis.lettuce.shutdown-timeout=0s
