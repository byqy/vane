spring:
  application:
    name: vane
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vane}
    username: ${DB_USERNAME:vane}
    password: ${DB_PASSWORD:vane}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

vane:
  auth:
    access-ttl: PT15M
    refresh-ttl: P7D
    token-store: ${AUTH_TOKEN_STORE:redis}
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    login-max-attempts: 5
    login-lock: PT15M
    mfa:
      issuer: vane
      challenge-ttl: PT5M
      secret-key: ${MFA_SECRET_KEY:}
      key-version: 1
      recovery-code-count: 10
  file:
    local-root: ${FILE_ROOT:./data/files}
    max-size-mb: 200
  sms:
    mode: ${VANE_SMS_MODE:logging}
    secret-keys: ${VANE_SMS_SECRET_KEYS:{}}
    active-key-version: ${VANE_SMS_SECRET_KEY_ACTIVE:}
    allowed-countries: ${VANE_SMS_ALLOWED_COUNTRIES:CN,HK,MO,TW,SG,MY,TH,VN,ID,PH}
    verify-template-code: ${VANE_SMS_VERIFY_TEMPLATE_CODE:password.reset}
    cost-per-message: ${VANE_SMS_COST_PER_MESSAGE:0}
    campaign:
      window-enabled: ${VANE_SMS_WINDOW_ENABLED:true}
      window-start: ${VANE_SMS_WINDOW_START:8}
      window-end: ${VANE_SMS_WINDOW_END:21}
    retention:
      log-days: ${VANE_SMS_RETENTION_LOG_DAYS:180}
      recipient-days: ${VANE_SMS_RETENTION_RECIPIENT_DAYS:90}
      inbound-days: ${VANE_SMS_RETENTION_INBOUND_DAYS:180}


