name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（测试 + 覆盖率门禁）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Backend tests
        working-directory: vane-server
        run: |
          set -o pipefail
          ./mvnw -B test 2>&1 | tee backend-tests.log
      - name: Report backend failures
        if: failure()
        working-directory: vane-server
        run: |
          grep -A4 -E '<<< (FAILURE|ERROR)!' backend-tests.log | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | head -20 | sed 's/^/::error::/'
          java -XshowSettings:properties -version 2>&1 | grep -E 'user.language|user.country|user.timezone|file.encoding' | tr '\n' ' ' | sed 's/^/::error::env:: /'
      - name: Coverage gate
        working-directory: vane-server
        run: pwsh -File ./scripts/verify-coverage.ps1

  frontend:
    name: 前端（typecheck + 测试 + 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12
      - name: Set up Node 26
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: vane-web/pnpm-lock.yaml
      - name: Install
        working-directory: vane-web
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: vane-web
        run: pnpm -r typecheck
      - name: Test
        working-directory: vane-web
        run: pnpm -r test
      - name: Build
        working-directory: vane-web
        run: pnpm -r build
